<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Hearts</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#ffeaf4;
}

.heart{
    position:absolute;
    font-size:50px;
}
</style>
</head>

<body>

<script>

const hearts = [];
const total = 15;

for(let i=0; i<total; i++){

    const div = document.createElement("div");
    div.className = "heart";
    div.innerHTML = "💖";

    document.body.appendChild(div);

    hearts.push({
        el: div,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,

        dx: (Math.random() * 2 - 1),
        dy: (Math.random() * 2 - 1),

        size: 50
    });
}

function moveHearts(){

    hearts.forEach(h => {

        h.x += h.dx;
        h.y += h.dy;

        if(h.x <= 0 || h.x >= window.innerWidth - h.size){
            h.dx *= -1;
        }

        if(h.y <= 0 || h.y >= window.innerHeight - h.size){
            h.dy *= -1;
        }

        h.el.style.left = h.x + "px";
        h.el.style.top = h.y + "px";
    });

    requestAnimationFrame(moveHearts);
}

moveHearts();

</script>

</body>
</html>
