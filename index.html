<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floating Hearts</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: linear-gradient(135deg, #ffe6f0, #fff5f8);
        width: 100vw;
        height: 100vh;
    }

    .heart {
        position: absolute;
        font-size: 50px;
        user-select: none;
        pointer-events: none;
        filter: drop-shadow(0 0 8px rgba(255, 100, 150, 0.4));
    }
</style>
</head>

<body>

<script>
    const heartCount = 7;
    const hearts = [];

    for (let i = 0; i < heartCount; i++) {

        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";

        document.body.appendChild(heart);

        const size = 35 + Math.random() * 30;

        heart.style.fontSize = `${size}px`;

        hearts.push({
            el: heart,

            x: Math.random() * (window.innerWidth - size),
            y: Math.random() * (window.innerHeight - size),

            // 느리게 움직이도록 속도 설정
            vx: (Math.random() * 1.2 + 0.4) * (Math.random() < 0.5 ? -1 : 1),
            vy: (Math.random() * 1.2 + 0.4) * (Math.random() < 0.5 ? -1 : 1),

            size: size
        });
    }

    function animate() {

        hearts.forEach(h => {

            h.x += h.vx;
            h.y += h.vy;

            // 좌우 벽 충돌
            if (h.x <= 0 || h.x + h.size >= window.innerWidth) {
                h.vx *= -1;
            }

            // 위아래 벽 충돌
            if (h.y <= 0 || h.y + h.size >= window.innerHeight) {
                h.vy *= -1;
            }

            h.el.style.transform = `translate(${h.x}px, ${h.y}px)`;
        });

        requestAnimationFrame(animate);
    }

    animate();

    // 창 크기 변경 대응
    window.addEventListener("resize", () => {
        hearts.forEach(h => {
            if (h.x + h.size > window.innerWidth) {
                h.x = window.innerWidth - h.size;
            }

            if (h.y + h.size > window.innerHeight) {
                h.y = window.innerHeight - h.size;
            }
        });
    });
</script>

</body>
</html>
